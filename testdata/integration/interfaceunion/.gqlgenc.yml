schema:
  files:
    - ./schema/*.graphql
  out:
    model:
      # file を指定する UC2。スキーマに interface (Node) / union (SearchResult) を
      # 含むが、生成される model_gen.go は Input 型 (SearchFilter) と Enum 型 (NodeKind) のみで、
      # interface / union / object は除去されることを担保する。
      file: ./domain/model_gen.go
query:
  files:
    - ./query/*.graphql
  out:
    query:
      file: ./domain/query_gen.go
    client:
      file: ./query/client_gen.go
