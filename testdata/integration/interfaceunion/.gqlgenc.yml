gqlgenc:
  query:
    - ./query/*.graphql
  querygen:
    filename: ./domain/query_gen.go
  clientgen:
    filename: ./query/client_gen.go
  export_query_type: true
gqlgen:
  schema:
    - ./schema/*.graphql
  # gqlgen.model を指定する UC2。スキーマに interface (Node) / union (SearchResult) を
  # 含むが、生成される model_gen.go は Input 型 (SearchFilter) と Enum 型 (NodeKind) のみで、
  # interface / union / object は除去されることを担保する。
  model:
    filename: ./domain/model_gen.go
  enable_model_json_omitzero_tag: true
  nullable_input_omittable: true
