schema:
  files:
    - ./schema/*.graphql
query:
  files:
    - ./query/*.graphql
generate:
  query: ./domain/query_gen.go
  client: ./query/client_gen.go
  # generate.model を指定する UC2。スキーマに interface (Node) / union (SearchResult) を
  # 含むが、生成される model_gen.go は Input 型 (SearchFilter) と Enum 型 (NodeKind) のみで、
  # interface / union / object は除去されることを担保する。
  model: ./domain/model_gen.go
