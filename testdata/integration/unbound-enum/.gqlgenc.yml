gqlgenc:
  query:
    - ./query/*.graphql
  querygen:
    filename: ./domain/query_gen.go
  clientgen:
    filename: ./query/client_gen.go
  export_query_type: true
gqlgen:
  schema:
    - ./schema/*.graphql
  # gqlgen.model を指定せず autobind もしないため、enum Status がどこにもバインドされない。
  # UC1 (client/server で model 共有) で autobind 先に enum 型が無い設定不備を再現する。
