schema:
  files:
    - ./schema/*.graphql
query:
  files:
    - ./query/*.graphql
bind:
  # generate.model.file を指定しないため gqlgenc は model_gen.go を生成しない。
  # bind.type.packages で既存モデル(server 側 gqlgen が生成)を使う(client/server で model を共有する構成)。
  type:
    packages:
      - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
  fragment:
    packages:
      - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
generate:
  query:
    file: ./domain/query_gen.go
    getters: true
  client:
    file: ./query/client_gen.go
