schema:
  files:
    - ./schema/*.graphql
  out:
    model:
      # file を指定しないため gqlgenc は model_gen.go を生成しない。
      # bind.package で既存モデル(server 側 gqlgen が生成)を使う(client/server で model を共有する構成)。
      bind:
        package:
          - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
query:
  files:
    - ./query/*.graphql
  out:
    query:
      file: ./domain/query_gen.go
      getters: true
      fragment:
        bind:
          package:
            - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
    client:
      file: ./query/client_gen.go
