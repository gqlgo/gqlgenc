schema:
  files:
    - ./schema/*.graphql
queries:
  - ./query/*.graphql
generate:
  query: ./domain/query_gen.go
  client: ./query/client_gen.go
# generate.model を指定しないため gqlgenc は model_gen.go を生成しない。
# autobind.model で既存モデル(server 側 gqlgen が生成)を使う(client/server で model を共有する構成)。
autobind:
  model:
    - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
  fragment:
    - github.com/Yamashou/gqlgenc/v3/testdata/integration/basic/domain
options:
  getters: true
