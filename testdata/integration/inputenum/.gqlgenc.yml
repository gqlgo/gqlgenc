schema:
  files:
    - ./schema/*.graphql
queries:
  - ./query/*.graphql
generate:
  query: ./domain/query_gen.go
  client: ./query/client_gen.go
  # generate.model を指定するため gqlgenc が model_gen.go を生成する。
  # 生成されるのはクエリで使う Input 型と Enum 型のみ(client/server で model を共有しない構成)。
  model: ./domain/model_gen.go
models:
  # custom scalar Timestamp を既存 Go 型にバインドする(Raw は未指定なので graphql.String 既定)
  Timestamp:
    model: github.com/99designs/gqlgen/graphql.Time
