type Query {
  search(input: SearchInput!): SearchResult!
}

input SearchInput {
  keyword: String!
  status: Status!
  page: PageInput
  createdAfter: Timestamp
  meta: Raw
}

input PageInput {
  size: Int!
}

# 対応する Go 型を models: でバインドした custom scalar (→ その型)
scalar Timestamp
# 対応する型が無い custom scalar (→ graphql.String)
scalar Raw

enum Status {
  ACTIVE
  INACTIVE
}

type SearchResult {
  total: Int!
  status: Status!
}
