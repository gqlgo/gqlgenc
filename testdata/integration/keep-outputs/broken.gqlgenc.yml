# .gqlgenc.yml と同じ出力先へ、検証に失敗するクエリ (スキーマに無いフィールドを選択) から
# 生成する設定。生成が失敗したときに前回の出力が残ることを検証する。
schema:
  files:
    - ./schema/*.graphql
query:
  files:
    - ./broken/*.graphql
generate:
  model:
    file: ./gen/model_gen.go
  query:
    file: ./gen/query_gen.go
  client:
    file: ./gen/client_gen.go
