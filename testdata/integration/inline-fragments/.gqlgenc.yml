# インラインフラグメントと選択の統合の fixture。次を検証する。
#   - interface / union への型条件 (... on Node) は、条件を満たす具体型の __typename で値が入る
#   - Go の名前へ変換すると綴りが変わる型 (HttpError → HTTPError) も __typename で判別できる
#   - 同じフィールド・同じ型へのインラインフラグメントを複数回選択しても、サブフィールドが落ちない
#   - 型条件の無いインラインフラグメント (... { id }) は、外側の型への条件として扱う
schema:
  files:
    - ./schema/*.graphql
query:
  files:
    - ./query/*.graphql
generate:
  query:
    file: ./gen/query_gen.go
  client:
    file: ./gen/client_gen.go
