schema:
  files:
    - ./schema/*.graphql
queries:
  - ./query/*.graphql
generate:
  query: ./domain/query_gen.go
  client: ./query/client_gen.go
# generate.model も autobind も指定しないため input 型 SearchFilter がどこにも束縛されない。
# リーフ ok は Boolean (built-in) で束縛されるため CreateGoTypes は成功し、未束縛は変数
# SearchFilter を解決する CreateOperations (OperationGenerator) 側で表面化する。
