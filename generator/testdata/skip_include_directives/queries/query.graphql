# A field with @skip or @include can be absent from the response, so its Go
# type is the one of a nullable field, also when the field is non-null.
query ItemWithDirectives($id: ID!, $withName: Boolean!, $withoutStatus: Boolean!) {
  item(id: $id) {
    id
    name @include(if: $withName)
    status @skip(if: $withoutStatus)
    parent @include(if: $withName) {
      id
    }
    children @skip(if: $withoutStatus) {
      id
    }
    ...ItemName @include(if: $withName)
    ... on Item @skip(if: $withoutStatus) {
      renamed: name
    }
  }
}

fragment ItemName on Item {
  itemName: name
}

# A field selected twice is always returned when one of the selections has no
# @skip and no @include, so it keeps the Go type of a non-null field.
query ItemSelectedTwice($id: ID!, $withName: Boolean!) {
  item(id: $id) {
    name @include(if: $withName)
    name
    status @skip(if: $withName)
    status @include(if: $withName)
  }
}
