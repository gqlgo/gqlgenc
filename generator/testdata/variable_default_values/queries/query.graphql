# A variable with a default value is optional, also when its type is non-null:
# the generated method leaves it out of the request when the argument is nil, so
# that the server applies the default value.
query ItemsWithDefaults(
  $first: Int = 10
  $requiredFirst: Int! = 5
  $status: Status = ACTIVE
  $filter: ItemFilter = { name: "a", statuses: [ACTIVE] }
  $tags: [String!] = ["x"]
) {
  items(first: $first, status: $status, filter: $filter, tags: $tags) {
    id
  }
  more: items(first: $requiredFirst) {
    id
  }
}

# A variable without a default value is always sent.
query ItemsWithAndWithoutDefault($status: Status, $first: Int = 10) {
  items(first: $first, status: $status) {
    id
  }
}
