version: "2"
run:
  go: "1.24"
linters:
  default: all
  disable:
    - cyclop # Cyclomatic complexity becomes very high when called from code generated by gqlgen, and it's difficult to resolve, so ignoring for now
    - dupl
    - dupword # Lint to detect redundant words, disabled as unnecessary
    - errname # No need to restrict error variable names, so ignoring
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godot
    - godox
    - interfacebloat # Lint to specify the upper limit of interface, disabled as unnecessary
    - ireturn # Returning interfaces results in errors, but it's not a problem, so ignoring
    - lll
    - maintidx # Disabled as cyclomatic etc. are unnecessary
    - mnd
    - musttag # Lint to require json tags, disabled as unnecessary
    - nestif
    - nlreturn
    - paralleltest
    - protogetter # Disabled because we don't use proto
    - tagliatelle # JSON tag format is not unified across external APIs and gen files, so all would need to be excluded. Too many files to exclude, so ignoring for now
    - tagalign
    - testpackage
    - varnamelen # No need to restrict variable name length, so disabled
    - wsl
    - wsl_v5 # wsl の後継。wsl と同じ理由で無効化
    - gosmopolitan # 日本語のコメント・テスト名を規約として使用しているため無効化
    - noinlineerr # if err := f(); err != nil は Go の慣用句であり生成コードも使用するため無効化
    - gomodguard # deprecated。後継の gomodguard_v2 が default: all で有効になる
    - err113 # enable to define dynamic error variables
  settings:
    depguard: # The file judgment is made against the absolute path, so you always need to put ** at the beginning.
      rules:
        gqlparserv1:
          deny:
            - pkg: ^github.com/vektah/gqlparser$
              desc: use github.com/vektah/gqlparser/v2
        gqlgencv1:
          deny:
            - pkg: ^github.com/Yamashou/gqlgenc/$
              desc: use github.com/Yamashou/gqlgenc/v3
    errcheck:
      exclude-functions:
        - Write
        - Copy
        - WriteString
        - Render
    forbidigo: # Identifier that matches forbid will result in error
      forbid:
        - pattern: ^print.*$
        - pattern: ^sort\..*$ # Use slices package
      analyze-types: true
    gomoddirectives:
      replace-local: true
    govet:
      enable-all: true
      disable:
      - shadow
      - fieldalignment
    nakedret:
      max-func-lines: 1
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    exhaustive:
      default-signifies-exhaustive: true # default 節があれば全ケース列挙を要求しない
    goconst:
      ignore-tests: true # テーブル駆動テストでは期待値の文字列を意図的に繰り返すため
    perfsprint:
      strconcat: false # Ignoring advice to change fmt.Sprintf("%s a", text) to text + "a" for now
    staticcheck:
      checks:
        - all
    unparam:
      check-exported: true
  exclusions:
    generated: strict # ignore // Code generated .* DO NOT EDIT\.$ file
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - containedctx
        path: _test.go
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/vektah/gqlparser)
        - prefix(github.com/99designs/gqlgen)
        - prefix(github.com/Yamashou/gqlgenc)
  exclusions:
    generated: strict # ignore // Code generated .* DO NOT EDIT\.$ file
    warn-unused: true
